<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wi‑Fi Finder</title>

<style>
    body {
        background: #0a0f0a;
        font-family: Arial;
        color: #00ff55;
        text-align: center;
        padding: 40px;
    }

    h1 {
        color: #00ff88;
        text-shadow: 0 0 10px #00ff88;
    }

    button {
        background: black;
        border: 2px solid #00ff55;
        color: #00ff55;
        padding: 12px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 18px;
        text-transform: uppercase;
        margin-top: 20px;
        box-shadow: 0px 0px 10px #00ff55;
    }

    button:hover {
        background: #00ff55;
        color: black;
    }

    #resultado {
        margin-top: 30px;
        font-size: 20px;
        text-shadow: 0 0 10px #00ff55;
    }

    .wifi {
        color: #00ff88;
        font-weight: bold;
    }

    .senha {
        color: #ffffff;
        font-weight: bold;
    }

    .footer {
        margin-top: 50px;
        opacity: 0.7;
        font-size: 14px;
    }
</style>

</head>
<body>

<h1>🔍 Wi‑Fi Finder</h1>

<button onclick="gerarSenha()">Descobrir Senha</button>

<div id="resultado"></div>

<div class="footer">
    Made by Nynno!<br>
    <img src="https://i.giphy.com/B4dt6rXq6nABilHTYM.webp" width="120">
</div>

<script>
    const wifis = [
        { nome: "Algar", senha: "allanfellipe363501" },
        { nome: "Lucky", senha: "**********" },
        { nome: "Nbrf", senha: "**********" },
        { nome: "EVA CRISTINA", senha: "**********" },
        { nome: "LeotinaSM", senha: "**********" }
    ];

    function gerarSenha() {
        const alvo = wifis.find(w => w.nome === "Algar");

        document.getElementById("resultado").innerHTML = `
            <p>Rede encontrada: <span class="wifi">${alvo.nome}</span></p>
            <p>Senha descoberta: <span class="senha">${alvo.senha}</span></p>
        `;
    }
</script>

</body>
</html>
