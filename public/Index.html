<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Scanner de Wi-Fi</title>
<style>
body {
    background: #0b0f19;
    font-family: Arial;
    color: white;
    text-align: center;
    padding: 30px;
}
h1 {
    font-size: 30px;
    margin-bottom: 20px;
}
.wifi-box {
    background: #111727;
    padding: 20px;
    margin: 10px auto;
    width: 300px;
    border-radius: 10px;
    border-left: 5px solid #3b82f6;
    text-align: left;
}
.ok {
    color: #22c55e;
}
.fail {
    color: #ef4444;
}
.footer {
    margin-top: 40px;
    opacity: 0.8;
    font-size: 14px;
}
.gif-container {
    margin-bottom: 25px;
}
</style>
</head>
<body>

<div class="gif-container">
    <iframe src="https://giphy.com/embed/B4dt6rXq6nABilHTYM" width="200" height="200" frameborder="0" allowfullscreen></iframe>
</div>

<h1>🔍 Escaneando Redes Wi‑Fi...</h1>

<div id="wifiDisplay">Carregando...</div>

<div class="footer">
    Made by <b>Nynno!</b>
</div>

<script>
fetch("/wifi")
    .then(res => res.json())
    .then(list => {
        let html = "";
        list.forEach(wifi => {
            html += `
                <div class="wifi-box">
                    <b>Rede:</b> ${wifi.ssid}<br>
                    ${
                        wifi.password
                        ? `<b class="ok">Senha encontrada:</b> ${wifi.password}`
                        : `<b class="fail">Falha ao descobrir a senha ❌</b>`
                    }
                </div>
            `;
        });
        document.getElementById("wifiDisplay").innerHTML = html;
    });
</script>

</body>
</html>
